<!DOCTYPE html>
<html lang="pt-br">
<link rel="stylesheet" href="css/style.css">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heisenberg</title>
</head>
<body>
    <h1>Exemplos de Formulário em HTML</h1>
    <b>Exemplo 1</b> 
    <br><br>
    <form method="get">
        <input type="text" name="nome" placeholder="Nome">
        <input type="email" name="email" placeholder="Email">
        <input type="date" name="data" placeholder="Data">
        <input type="tel" name="celular" placeholder="Celular">
        <input type="password" name="senha" placeholder="Senha">
        <button>Cadastrar</button>
    </form>
    <br>
    <b>Exemplo 2</b>
    <br><br>
    <textarea >"Texto Livre"</textarea>
    <br><br>
    <b>Exemplo 3</b>
    <br><br>
    <fieldset>
        <legend>Formulario</legend>
        Nome: <input type="text"> <br><br>
        Sexo: <input type="radio" name="sexoM"> Masculino <input type="radio" name="sexoF"> Feminino <br><br>
        País: <select name="lista" id="lista"><br><br>
            <option>Selecione uma opção</option>
            <option>Brasil</option>
            <option>Alemanha Ocidental</option>
            <option>Liechtenstein</option>
            <option>Tuvalu</option>
            <option>Micronesia</option>
            <option>Ilhas Salomão</option>
            <option>Ilhas Fiji</option>
            <option>Antigua e Barbuda</option>
            <option>Barbados</option>
            <option>Quirguistão</option>
        </select>
        <br><br>
        Mensagem: <br>
        <textarea></textarea>
        <br><br>
        <input type="checkbox" name="newsletter"> Assinar Newsletter? <br><br>
        <button>Enviar</button>
    </fieldset>
    <br>
    <b>Exemplo 4</b>
    <br><br>
    <input type="search">
    <button>Clique para pesquisar</button>
</body>
</html>
