<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos</title>
    <link rel="stylesheet" href="css/exemplowrap.css">
</head>
<body>
    <h1>Página de Estudos - Flex Wrap</h1>

    <h1>flex-wrap: nowrap;</h1>
        <section class="container nowrap">
            <!-- o nome guardado foi necessario pois eu preciso definir um conteudo que nao possa ser quebrado. como uma palavra ou uma imagem. se fosse um frase, ele quebraria as linhas da frase antes de ultrapassar o container -->
            <div class="item">TesteDoItem1</div>
            <div class="item">TesteDoItem2</div>
            <div class="item">TesteDoItem3</div>
        </section>

        <h1>flex-wrap: wrap;</h1>
        <section class="container wrap">
            <div class="item">TesteDoItem1</div>
            <div class="item">TesteDoItem2</div>
            <div class="item">TesteDoItem3</div>
        </section>

        <h1>flex-wrap: wrap-reverse;</h1>
        <section class="container wrap-reverse">
            <div class="item">TesteDoItem1</div>
            <div class="item">TesteDoItem2</div>
            <div class="item">TesteDoItem3</div>
        </section>
</body>
</html>
