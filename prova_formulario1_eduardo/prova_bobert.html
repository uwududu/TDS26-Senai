<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
    <link rel="stylesheet" href="_css/prova_bobert.css">
</head>
<body>
    <h1>Exemplos de Formulário em HTML</h1>
    <hr style="border: 10px solid #800020; border-radius: 25px;">
    <h3>Exemplo 1</h3>
    <input type="text" placeholder="Nome" class="exemplo1">
    <input type="email" placeholder="Email" class="exemplo1">
    <input type="tel" placeholder="Celular" class="exemplo1">
    <input type="password" placeholder="Senha" class="exemplo1">
    <button style="background-color: gold; border: 5px solid blueviolet; border-radius: 10px; height: 40px;">Cadastrar</button>
    <hr style="border: 10px solid #800020; border-radius: 25px;">
    <h3>Exemplo 2</h3>
    <textarea cols="75" rows="5" style="background-color: rgba(175, 175, 226, 0.661);"></textarea>
    <hr style="border: 10px solid #800020; border-radius: 25px;">
    <h3>Exemplo 3</h3>
    <fieldset class="exemplo3">
        <legend>Formulário</legend>
        Nome: <input type="text">
        <p></p>
        Sexo: <input type="radio">Masculino <input type="radio">Feminino
        <p></p>
        País: <select>
            <option>Selecione uma opção...</option>
            <option>Brasil</option>
            <option>Noruega.</option>
            <option>Espanha</option>
            <option>Suiça</option>
        </select>
        <p></p>
        Mensagem: <br>
        <textarea></textarea>
        <p></p>
        <input type="checkbox">Assinar Newsletter?
        <p></p>
        <input type="submit" value="Enviar" style="color: blueviolet;">
    </fieldset>
    <hr style="border: 10px solid #800020; border-radius: 25px;">
    <h3>Exemplo 4</h3>
    <input type="search" style="border: 2px solid red; height: 45px;">
    <input class="butt_pesquisa" type="submit" value="Clique para pesquisar">
    <hr style="border: 10px solid #800020; border-radius: 25px;">
    <h3>Exemplo 5</h3>
    <fieldset>
        <legend>Selecione a cor que mais agrada</legend>
        <input type="checkbox">azul
        <input type="checkbox">vermelho
        <input type="checkbox">verde
        <input type="checkbox">amarelo
    </fieldset>
</body>
</html>
