<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalho</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="formulario">
        <form method="POST" action="php/tela2.php">
            <h1>Cadastro de Veículo</h1>
            <h3>Marca com modelo</h3>
            <input type="text" class="cad" name="marca">
            <h3>Ano de Fabricação</h3>
            <input type="date" class="cad" name="ano">
            <h3>País de Origem</h3>
            <input type="text" class="cad" name="pais">
            <h3>Tipo do Motor</h3>
            <input type="text" class="cad" name="motor">
            <h3>Cor do Veículo</h3>
            <input type="color" class="cad" name="cor">
            <h3>Placa do Carro</h3>
            <input type="text" class="cad" name="placa">
            <br><br>
            <input type="submit" value="Cadastrar Veículo" class="cadastro" >
        </form>
    </div>
</body>
</html>
